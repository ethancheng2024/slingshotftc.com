<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="FTC Team 20240 Slingshot Robotics at Westwood High School in Austin, Texas.">
<title>Slingshot Robotics | FTC Team 20240</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080315;--purple:#8c52ff;--white:#fff;--line:#6e3ac7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Poppins,Arial,sans-serif}
.header{height:72px;background:#000;display:flex;align-items:center;padding:7px 6%;position:relative;border-bottom:1px solid #34205a}
.header-logo{display:flex;align-items:center;text-decoration:none}.header img{width:145px;height:58px;object-fit:contain}
nav{position:absolute;left:56%;transform:translateX(-50%);display:flex;gap:clamp(30px,4vw,68px)}
nav a{color:#fff;text-decoration:none;text-transform:uppercase;font-size:14px;font-weight:800;white-space:nowraptransition:color .28s ease}
nav a:hover,nav a:focus-visible,nav a[aria-current="page"]{color:var(--purple)}
main{height:calc(100vh - 72px);min-height:650px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.crystals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.crystal{position:absolute;width:15px;height:15px;border:2px solid #8c52ff;transform:rotate(45deg);opacity:.28;animation:twinkle 3.4s ease-in-out infinite}
.crystal:after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.8)}
.crystal:nth-child(1){left:8%;top:18%;animation-delay:-.4s}
.crystal:nth-child(2){left:18%;top:66%;width:7px;height:7px;animation-delay:-2.1s}
.crystal:nth-child(3){left:31%;top:23%;width:6px;height:6px;animation-delay:-3.3s}
.crystal:nth-child(4){left:43%;top:76%;width:12px;height:12px;animation-delay:-1.2s}
.crystal:nth-child(5){left:58%;top:15%;width:8px;height:8px;animation-delay:-2.8s}
.crystal:nth-child(6){left:69%;top:68%;width:6px;height:6px;animation-delay:-.9s}
.crystal:nth-child(7){left:82%;top:25%;width:11px;height:11px;animation-delay:-3.8s}
.crystal:nth-child(8){left:91%;top:73%;width:7px;height:7px;animation-delay:-1.7s}
.crystal:nth-child(9){left:74%;top:43%;width:5px;height:5px;animation-delay:-2.5s}
.crystal:nth-child(10){left:24%;top:45%;width:5px;height:5px;animation-delay:-4.1s}
@keyframes twinkle{0%,100%{opacity:.12;transform:rotate(45deg) scale(.65)}45%{opacity:1;transform:rotate(45deg) scale(1.45)}60%{opacity:.38;transform:rotate(45deg) scale(.9)}}
.stage{width:min(1120px,82vw);position:relative;z-index:1;text-align:center;transform:translateY(-2%)}
.wordmark{width:min(720px,64vw);height:auto;display:block;margin:0 auto 18px;filter:drop-shadow(0 0 0 transparent)}
.teamline{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 auto}
.teamline:before,.teamline:after{content:"";height:2px;background:#fff;width:150px}
.teamline strong{font-size:clamp(20px,2vw,30px);letter-spacing:.12em;white-space:nowrap}
.school{font-size:clamp(11px,1vw,15px);letter-spacing:.28em;margin:14px 0 0;text-transform:uppercase}
.achievement{display:flex;align-items:center;justify-content:center;gap:32px;margin-top:58px}
.year{font-family:"Poppins",Arial,sans-serif;font-size:clamp(58px,7vw,100px);line-height:.85;font-weight:900;letter-spacing:-.055em;color:#ffe500}
.divider{display:none}
.award{font-family:"Poppins",Arial,sans-serif;text-align:left;font-size:clamp(42px,5vw,74px);font-weight:900;line-height:.95;letter-spacing:-.045em;text-transform:uppercase;color:#ffe500;max-width:none;position:relative;cursor:default}

.blueprint-left{position:absolute;left:-130px;top:7%;width:410px;height:410px;border:1px solid var(--line);transform:rotate(38deg);opacity:.45}
.blueprint-left:before,.blueprint-left:after{content:"";position:absolute;border:1px solid var(--line)}
.blueprint-left:before{width:260px;height:130px;left:55px;top:120px}
.blueprint-left:after{width:150px;height:270px;left:130px;top:60px}
.arc{position:absolute;right:-175px;top:25%;width:500px;height:500px;border:1px solid var(--line);border-radius:50%;opacity:.7}
.arc:before{content:"";position:absolute;left:50%;top:-210px;width:1px;height:620px;background:var(--line)}
.arc:after{content:"";position:absolute;left:-80px;top:50%;width:650px;height:1px;background:var(--line)}
.cross{position:absolute;width:28px;height:28px;opacity:.75}
.cross:before,.cross:after{content:"";position:absolute;background:var(--purple)}
.cross:before{width:28px;height:1px;top:13px;left:0}.cross:after{height:28px;width:1px;left:13px;top:0}
.c1{left:12%;bottom:12%}.c2{right:8%;top:12%}.c3{right:10%;bottom:12%}
.sidecopy{display:none}.bottomline{display:none}
@media(max-width:850px){
.header{height:auto;min-height:72px;padding:12px 18px;flex-direction:column}.header img{width:130px}
nav{position:static;transform:none;flex-wrap:wrap;justify-content:center;gap:12px 22px;margin-top:8px}nav a{font-size:11px}
main{height:auto;min-height:calc(100vh - 100px);padding:70px 0}.stage{width:90vw}.wordmark{width:min(700px,88vw)}
.teamline:before,.teamline:after{width:45px}.teamline strong{font-size:16px}.school{letter-spacing:.15em}
.achievement{gap:18px;margin-top:50px}.divider{height:70px}.award{font-size:clamp(19px,5vw,30px)}
.blueprint-left,.arc,.sidecopy,.bottomline,.cross{display:none}
}
@media(max-width:520px){.achievement{align-items:flex-start}.year{font-size:17vw}.award{font-size:5vw}.divider{height:58px}}
</style>
</head>
<body>
<header class="header">
<a class="header-logo" href="/" aria-label="Slingshot home"><img src="./logo.png" alt="Slingshot FTC Team 20240 logo"></a>
<nav aria-label="Main navigation">
<a href="/" aria-current="page">Home</a>
<a href="/about/">About</a>
<a href="/robot/">Robot</a>
<a href="/outreach/">Outreach</a>
<a href="/sponsors/">Sponsors</a>
<a href="/contact/">Contact</a>
</nav>
</header>
<main>
<div class="blueprint-left" aria-hidden="true"></div>
<div class="arc" aria-hidden="true"></div>
<div class="cross c1" aria-hidden="true"></div><div class="cross c2" aria-hidden="true"></div><div class="cross c3" aria-hidden="true"></div>

<div class="crystals" aria-hidden="true"><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span></div>
<section class="stage" aria-label="Slingshot FTC Team 20240">
<img class="wordmark" src="./logo.png" alt="Slingshot">
<div class="teamline"><strong>FTC TEAM 20240</strong></div>
<p class="school">Westwood High School · Austin, Texas</p>
<div class="achievement">
<div class="award" id="biobuzz">2027 BIOBUZZ</div>
</div>
</section>
</main>

<script>
(() => {
  const trigger = document.getElementById('biobuzz');
  if (!trigger || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const beeSVG = `
    <svg viewBox="0 0 64 44" width="42" height="30" aria-hidden="true">
      <g class="bee-wings" fill="rgba(255,255,255,.82)" stroke="#d8cfff" stroke-width="1.5">
        <ellipse cx="28" cy="13" rx="13" ry="8" transform="rotate(-24 28 13)"/>
        <ellipse cx="38" cy="13" rx="13" ry="8" transform="rotate(24 38 13)"/>
      </g>
      <g>
        <ellipse cx="33" cy="25" rx="18" ry="11" fill="#FFD900" stroke="#111" stroke-width="2"/>
        <path d="M23 16.5v17M32 14v22M41 16v17" stroke="#17120a" stroke-width="5"/>
        <circle cx="50" cy="23" r="7" fill="#FFD900" stroke="#111" stroke-width="2"/>
        <circle cx="53" cy="21" r="1.6" fill="#111"/>
        <path d="M54 17q4-7 7-5M50 16q1-7 4-8" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M15 25l-7 3 7 2" fill="#111"/>
      </g>
    </svg>`;

  function spawnBee() {
    const r = trigger.getBoundingClientRect();
    const bee = document.createElement('div');
    bee.className = 'flying-bee';
    bee.innerHTML = beeSVG;
    Object.assign(bee.style, {
      position:'fixed', left:'0', top:'0', width:'42px', height:'30px',
      zIndex:'9999', pointerEvents:'none', willChange:'transform,opacity'
    });
    document.body.appendChild(bee);

    const sx = r.left + r.width * (.55 + Math.random()*.25);
    const sy = r.top + r.height * (.25 + Math.random()*.45);
    const side = Math.random() < .5 ? -1 : 1;
    const ex = side > 0 ? innerWidth + 90 : -120;
    const ey = Math.max(-80, Math.min(innerHeight + 80, sy + (Math.random()-.5)*innerHeight*.75));
    const c1x = sx + side*(100 + Math.random()*180);
    const c1y = sy + (Math.random()-.5)*220;
    const c2x = sx + side*(innerWidth*.35 + Math.random()*innerWidth*.2);
    const c2y = sy + (Math.random()-.5)*360;
    const start = performance.now();
    const duration = 2400 + Math.random()*1300;
    const phase = Math.random()*Math.PI*2;

    function bez(a,b,c,d,t){const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d}
    function frame(now){
      const t=Math.min(1,(now-start)/duration);
      const ease=1-Math.pow(1-t,2.2);
      let x=bez(sx,c1x,c2x,ex,ease);
      let y=bez(sy,c1y,c2y,ey,ease);
      x += Math.sin(t*34+phase)*10 + Math.sin(t*71+phase)*3;
      y += Math.cos(t*29+phase)*8 + Math.sin(t*63)*4;
      const nx=bez(sx,c1x,c2x,ex,Math.min(1,ease+.008));
      const ny=bez(sy,c1y,c2y,ey,Math.min(1,ease+.008));
      const angle=Math.atan2(ny-y,nx-x)*180/Math.PI;
      bee.style.opacity = t < .06 ? String(t/.06) : String(Math.min(1,(1-t)*7));
      bee.style.transform=`translate3d(${x}px,${y}px,0) rotate(${angle}deg)`;
      if(t<1) requestAnimationFrame(frame); else bee.remove();
    }
    requestAnimationFrame(frame);
  }

  let last=0;
  trigger.addEventListener('mouseenter',()=>{
    const now=performance.now();
    if(now-last>120){ spawnBee(); last=now; }
  });
})();
</script>
</body>
</html>
