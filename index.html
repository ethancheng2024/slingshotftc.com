<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FTC Team 20240 Slingshot Robotics at Westwood High School in Austin, Texas.">
  <meta property="og:title" content="Slingshot Robotics | FTC Team 20240">
  <meta property="og:description" content="FTC Team 20240 Slingshot Robotics at Westwood High School in Austin, Texas.">
  <meta property="og:url" content="https://slingshotftc.com/">
  <link rel="canonical" href="https://slingshotftc.com/">
  <title>Slingshot Robotics | FTC Team 20240</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--black:#000;--deep:#0e0427;--purple:#8c52ff;--white:#fff;--muted:#c8c1d5}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:var(--deep);color:var(--white);font-family:"Poppins",Arial,sans-serif}
    .header{height:72px;width:100%;display:flex;align-items:center;padding:8px 7%;background:var(--black);position:relative;border-bottom:1px solid #1d1234}
    .logo-wrap{width:180px;height:62px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .logo{width:100%;height:100%;display:block;object-fit:contain}
    nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(24px,3.2vw,58px)}
    nav a{color:var(--white);text-decoration:none;text-transform:uppercase;font-size:clamp(12px,.95vw,16px);font-weight:800;white-space:nowrap;transition:color .2s ease}
    nav a:hover,nav a:focus-visible,nav a[aria-current="page"]{color:var(--purple)}
    nav a:focus-visible{outline:2px solid var(--white);outline-offset:5px}

    main{min-height:calc(100vh - 72px);display:flex;align-items:center}
    .home{width:min(1120px,86vw);margin:0 auto;padding:72px 0 90px}
    .mark{width:min(720px,72vw);height:auto;display:block;margin:0 0 42px;object-fit:contain;object-position:left center}
    .team{font-size:clamp(16px,1.45vw,21px);font-weight:700;line-height:1.5;margin:0}
    .team strong{color:var(--purple);font-weight:900}
    .location{color:var(--muted);font-size:clamp(13px,1vw,15px);font-weight:500;margin:8px 0 0}
    .achievement{margin-top:clamp(62px,9vh,105px);padding-top:24px;border-top:1px solid var(--purple);display:grid;grid-template-columns:150px minmax(0,680px);gap:clamp(24px,5vw,72px);align-items:start}
    .year{font-size:clamp(40px,5vw,66px);font-weight:900;line-height:.9;letter-spacing:-.055em;color:var(--purple)}
    .award{font-size:clamp(24px,3vw,43px);font-weight:800;line-height:1.05;letter-spacing:-.035em;text-transform:uppercase;margin:0}
    .award-note{color:var(--muted);font-size:13px;font-weight:500;margin:16px 0 0}

    @media(max-width:900px){
      .header{height:auto;padding:14px 20px 18px;flex-direction:column}
      .logo-wrap{width:160px;height:56px}
      nav{position:static;transform:none;justify-content:center;flex-wrap:wrap;gap:14px 22px;margin-top:8px}
      main{min-height:auto}
      .home{width:min(88vw,680px);padding:70px 0 90px}
      .mark{width:min(620px,88vw);margin-bottom:34px}
      .achievement{grid-template-columns:1fr;gap:16px;margin-top:64px}
    }
    @media(max-width:520px){
      nav{gap:11px 15px}
      nav a{font-size:11px}
      .mark{width:100%}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-wrap"><img class="logo" src="./logo.png" alt="Slingshot FTC Team 20240 logo"></div>
    <nav aria-label="Main navigation">
      <a href="/" aria-current="page">Home</a>
      <a href="/about/">About</a>
      <a href="/robot/">Robot</a>
      <a href="/outreach/">Outreach</a>
      <a href="/sponsors/">Sponsors</a>
      <a href="/contact/">Contact</a>
    </nav>
  </header>

  <main>
    <section class="home" aria-label="Slingshot FTC Team 20240">
      <img class="mark" src="./logo.png" alt="Slingshot">
      <p class="team"><strong>FTC TEAM 20240</strong></p>
      <p class="location">Westwood High School · Austin, Texas</p>

      <div class="achievement">
        <div class="year">2026</div>
        <div>
          <p class="award">FIRST World Championship Qualifier</p>
          <p class="award-note">FIRST Tech Challenge</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
