<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="FTC Team 20240 Slingshot Robotics at Westwood High School in Austin, Texas.">
<title>Slingshot Robotics | FTC Team 20240</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080315;--purple:#8c52ff;--white:#fff;--line:#6e3ac7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Poppins,Arial,sans-serif}
.header{height:72px;background:#000;display:flex;align-items:center;padding:7px 6%;position:relative;border-bottom:1px solid #34205a}
.header-logo{display:flex;align-items:center;text-decoration:none}.header img{width:145px;height:58px;object-fit:contain}
nav{position:absolute;left:56%;transform:translateX(-50%);display:flex;gap:clamp(30px,4vw,68px)}
nav a{color:#fff;text-decoration:none;text-transform:uppercase;font-size:14px;font-weight:800;white-space:nowraptransition:color .28s ease}
nav a:hover,nav a:focus-visible,nav a[aria-current="page"]{color:var(--purple)}
main{height:calc(100vh - 72px);min-height:650px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage{width:min(1120px,82vw);position:relative;text-align:center;transform:translateY(-2%)}
.wordmark{width:min(720px,64vw);height:auto;display:block;margin:0 auto 18px;filter:drop-shadow(0 0 0 transparent)}
.teamline{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 auto}
.teamline:before,.teamline:after{content:"";height:2px;background:#fff;width:150px}
.teamline strong{font-size:clamp(20px,2vw,30px);letter-spacing:.12em;white-space:nowrap}
.school{font-size:clamp(11px,1vw,15px);letter-spacing:.28em;margin:14px 0 0;text-transform:uppercase}
.achievement{display:flex;align-items:center;justify-content:center;gap:32px;margin-top:58px}
.year{font-family:"Poppins",Arial,sans-serif;font-size:clamp(58px,7vw,100px);line-height:.85;font-weight:900;letter-spacing:-.055em;color:#ffe500}
.divider{display:none}
.award{font-family:"Poppins",Arial,sans-serif;text-align:left;font-size:clamp(42px,5vw,74px);font-weight:900;line-height:.95;letter-spacing:-.045em;text-transform:uppercase;color:#ffe500;max-width:none}
.blueprint-left{position:absolute;left:-130px;top:7%;width:410px;height:410px;border:1px solid var(--line);transform:rotate(38deg);opacity:.45}
.blueprint-left:before,.blueprint-left:after{content:"";position:absolute;border:1px solid var(--line)}
.blueprint-left:before{width:260px;height:130px;left:55px;top:120px}
.blueprint-left:after{width:150px;height:270px;left:130px;top:60px}
.arc{position:absolute;right:-175px;top:25%;width:500px;height:500px;border:1px solid var(--line);border-radius:50%;opacity:.7}
.arc:before{content:"";position:absolute;left:50%;top:-210px;width:1px;height:620px;background:var(--line)}
.arc:after{content:"";position:absolute;left:-80px;top:50%;width:650px;height:1px;background:var(--line)}
.cross{position:absolute;width:28px;height:28px;opacity:.75}
.cross:before,.cross:after{content:"";position:absolute;background:var(--purple)}
.cross:before{width:28px;height:1px;top:13px;left:0}.cross:after{height:28px;width:1px;left:13px;top:0}
.c1{left:12%;bottom:12%}.c2{right:8%;top:12%}.c3{right:10%;bottom:12%}
.sidecopy{display:none}.bottomline{display:none}
@media(max-width:850px){
.header{height:auto;min-height:72px;padding:12px 18px;flex-direction:column}.header img{width:130px}
nav{position:static;transform:none;flex-wrap:wrap;justify-content:center;gap:12px 22px;margin-top:8px}nav a{font-size:11px}
main{height:auto;min-height:calc(100vh - 100px);padding:70px 0}.stage{width:90vw}.wordmark{width:min(700px,88vw)}
.teamline:before,.teamline:after{width:45px}.teamline strong{font-size:16px}.school{letter-spacing:.15em}
.achievement{gap:18px;margin-top:50px}.divider{height:70px}.award{font-size:clamp(19px,5vw,30px)}
.blueprint-left,.arc,.sidecopy,.bottomline,.cross{display:none}
}
@media(max-width:520px){.achievement{align-items:flex-start}.year{font-size:17vw}.award{font-size:5vw}.divider{height:58px}}
</style>
</head>
<body>
<header class="header">
<a class="header-logo" href="/" aria-label="Slingshot home"><img src="./logo.png" alt="Slingshot FTC Team 20240 logo"></a>
<nav aria-label="Main navigation">
<a href="/" aria-current="page">Home</a>
<a href="/about/">About</a>
<a href="/robot/">Robot</a>
<a href="/outreach/">Outreach</a>
<a href="/sponsors/">Sponsors</a>
<a href="/contact/">Contact</a>
</nav>
</header>
<main>
<div class="blueprint-left" aria-hidden="true"></div>
<div class="arc" aria-hidden="true"></div>
<div class="cross c1" aria-hidden="true"></div><div class="cross c2" aria-hidden="true"></div><div class="cross c3" aria-hidden="true"></div>

<section class="stage" aria-label="Slingshot FTC Team 20240">
<img class="wordmark" src="./logo.png" alt="Slingshot">
<div class="teamline"><strong>FTC TEAM 20240</strong></div>
<p class="school">Westwood High School · Austin, Texas</p>
<div class="achievement">
<div class="award">2027 BIOBUZZ</div>
</div>
</section>
</main>
</body>
</html>
