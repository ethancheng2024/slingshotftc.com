<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slingshot Robotics | FTC Team 20240</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0E0427; }
    body { font-family: "Poppins", Arial, sans-serif; }
    .header { position:relative; height:72px; width:100%; display:flex; align-items:center; padding:8px 7%; background:#000; }
    .logo-wrap { width:180px; height:62px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; overflow:hidden; }
    .logo { width:100%; height:100%; display:block; object-fit:contain; object-position:center center; }
    nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:clamp(34px,4vw,72px); padding:0; }
    nav a { color:#fff; text-decoration:none; text-transform:uppercase; font-size:clamp(14px,1vw,18px); font-weight:800; white-space:nowrap; transition:color .28s ease; }
    nav a:hover, nav a:focus-visible { color:#8c45ff; }
    @media (max-width:900px) {
      .header { height:auto; padding:18px 22px 26px; flex-direction:column; align-items:center; }
      .logo-wrap { width:170px; height:60px; }
      nav { width:100%; padding:20px 0 0; gap:20px 28px; flex-wrap:wrap; }
      nav a { font-size:15px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-wrap"><img class="logo" src="./logo.png" alt="Slingshot FTC Team 20240"></div>
    <nav aria-label="Main navigation">
      <a href="#">Home</a><a href="#">About</a><a href="#">Contact</a>
    </nav>
  </header>
</body>
</html>
